<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalender Penyegaran | Penyegaran Pagi</title>
  <style>
    :root {
      --bg: #f6f5ee;
      --card: #ffffff;
      --primary: #1f4d36;
      --primary-light: #2d6a4f;
      --accent: #e9c46a;
      --text: #1e2923;
      --muted: #5c6b62;
      --border: #dce3dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      background: var(--primary);
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    header h1 { font-size: 1.2rem; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.12);
    }
    nav a.active, nav a:hover {
      background: var(--accent);
      color: #1b2a22;
      font-weight: 600;
    }
    main { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.75rem;
    }
    select {
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      background: #fff;
    }
    .days-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .day-title { font-weight: 700; color: var(--primary); font-size: 1.05rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .btn {
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.45rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: #fff;
    }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
      border-color: #adb8b1;
      color: #6b7770;
    }
    .note { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Kalender Penyegaran Pagi</h1>
    <nav>
      <a href="../index.html">Beranda</a>
      <a href="kalender.html" class="active">Kalender</a>
      <a href="riwayat.html">Riwayat</a>
      <a href="tentang.html">Tentang</a>
      <a href="panduan.html">Panduan</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>Pilih Pekan &amp; Hari Penyegaran</h2>
      <p class="note">Pilih pekan (01–12) untuk melihat daftar hari dan bahan bacaan yang tersedia di folder <code>teks/</code>.</p>
      <div class="controls">
        <div>
          <label for="pekanSelect"><strong>Pekan:</strong></label>
          <select id="pekanSelect"></select>
        </div>
        <span class="note" id="ringkasanPekan"></span>
      </div>
    </section>

    <section class="days-grid" id="daysGrid"></section>
  </main>

  <script>
    const hariList = [
      { kode: "0_garis_besar", label: "Garis Besar (Hari 0)" },
      { kode: "1_senin", label: "Senin" },
      { kode: "2_selasa", label: "Selasa" },
      { kode: "3_rabu", label: "Rabu" },
      { kode: "4_kamis", label: "Kamis" },
      { kode: "5_jumat", label: "Jumat" },
      { kode: "6_sabtu", label: "Sabtu" }
    ];

    // Daftar file _03 yang tersedia di folder teks/
    const tersedia03 = new Set([
      "07_2_selasa_03", "07_3_rabu_03", "07_4_kamis_03", "07_5_jumat_03", "07_6_sabtu_03",
      "08_0_garis_besar_03", "08_1_senin_03", "08_2_selasa_03", "08_3_rabu_03",
      "08_4_kamis_03", "08_5_jumat_03", "08_6_sabtu_03",
      "09_1_senin_03", "09_2_selasa_03", "09_3_rabu_03", "09_4_kamis_03", "09_5_jumat_03"
    ]);

    const pekanSelect = document.getElementById("pekanSelect");
    const daysGrid = document.getElementById("daysGrid");
    const ringkasanPekan = document.getElementById("ringkasanPekan");

    for (let i = 1; i <= 12; i++) {
      const p = String(i).padStart(2, "0");
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = `Pekan ${p}`;
      if (p === "07") opt.selected = true;
      pekanSelect.appendChild(opt);
    }

    function renderPekan(pekan) {
      daysGrid.innerHTML = "";
      let jumlah03 = 0;

      hariList.forEach((h) => {
        const file01 = `t_${pekan}_${h.kode}_01.html`;
        const key03 = `${pekan}_${h.kode}_03`;
        const file03 = `t_${key03}.html`;
        const ada03 = tersedia03.has(key03);
        if (ada03) jumlah03++;

        const card = document.createElement("article");
        card.className = "day-card";
        card.innerHTML = `
          <div>
            <div class="day-title">${h.label}</div>
            <div class="note">Pekan ${pekan} · ${h.kode}</div>
          </div>
          <div class="btn-group">
            <a class="btn primary" href="${file01}">Buku Asli (_01)</a>
            <a class="btn ${ada03 ? "" : "disabled"}" href="${ada03 ? file03 : "#"}">
              ${ada03 ? "Penggalian AI (_03)" : "AI (_03) N/A"}
            </a>
          </div>
        `;
        daysGrid.appendChild(card);
      });

      ringkasanPekan.textContent = `Menampilkan 7 sesi untuk Pekan ${pekan} (${jumlah03} sesi memiliki versi _03).`;
    }

    pekanSelect.addEventListener("change", (e) => renderPekan(e.target.value));
    renderPekan(pekanSelect.value);
  </script>
</body>
</html>
